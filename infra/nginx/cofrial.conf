# Proxy inverso de cada nodo: recibe HTTPS re-cifrado desde el ALB y reenvía a Django o Metabase.
# IP real del cliente: el ALB la entrega en X-Forwarded-For; solo se confía en la red de la VPC.
set_real_ip_from 10.20.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
server_tokens off;

map $http_x_forwarded_proto $proto { default $http_x_forwarded_proto; "" https; }

upstream django   { server django:8000; keepalive 16; }
upstream metabase { server metabase:3000; }

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/interno.crt;
    ssl_certificate_key /etc/nginx/certs/interno.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Chequeo de salud del ALB: llega a Django y a PostgreSQL (no solo a Nginx)
    location = /salud/ {
        access_log off;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://django;
    }
    # Límite de intentos en los formularios de acceso (además del bloqueo de django-axes)
    location ~ ^/(accounts/login|admin/login|ingresar|cuentas/2fa)/ {
        limit_req zone=acceso burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy_django.inc;
    }
    location / { include /etc/nginx/conf.d/proxy_django.inc; }
}

server {
    listen 443 ssl;
    server_name ~^bi\.;
    ssl_certificate     /etc/nginx/certs/interno.crt;
    ssl_certificate_key /etc/nginx/certs/interno.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://metabase;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto;
    }
}
