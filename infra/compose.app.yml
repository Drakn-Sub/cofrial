# Nodo de aplicación (cofrial-app-a y cofrial-app-b). Solo Nginx publica un puerto (443),
# y el Security Group solo deja llegar al balanceador.
x-endurecido: &endurecido
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  django:
    <<: *endurecido
    build: ../app
    image: cofrial-django:local
    env_file: /etc/cofrial/app.env
    tmpfs: [/tmp]
    volumes:
      - /etc/pki/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro
    mem_limit: 900m

  alertas:
    <<: *endurecido
    image: cofrial-django:local
    command: ["python", "manage.py", "evaluar_alertas"]
    env_file: /etc/cofrial/app.env
    tmpfs: [/tmp]
    volumes:
      - /etc/pki/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro
    depends_on: [django]
    mem_limit: 300m

  nginx:
    <<: *endurecido
    image: public.ecr.aws/nginx/nginx:1.27-alpine
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    ports: ["443:443"]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./nginx/cofrial.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_django.inc:/etc/nginx/conf.d/proxy_django.inc:ro
      - /etc/cofrial/certs:/etc/nginx/certs:ro
    depends_on: [django]
    mem_limit: 128m

  metabase:
    restart: unless-stopped
    image: metabase/metabase:${METABASE_VERSION:-latest}  # fijar la versión exacta antes de la demo
    env_file: /etc/cofrial/metabase.env
    environment:
      JAVA_OPTS: "-Xmx1g"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1500m
    profiles: ["bi"]
