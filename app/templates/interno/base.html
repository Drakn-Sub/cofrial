{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Intranet{% endblock %} | Cofrial</title>
  <link rel="stylesheet" href="{% static 'cofrial/base.css' %}">
  <link rel="stylesheet" href="{% static 'cofrial/riel.css' %}">
  <link rel="stylesheet" href="{% static 'cofrial/intranet.css' %}">
  {% block cabeza %}{% endblock %}
</head>
<body>
{% include "interno/_riel.html" %}
<main class="con-riel">
  {% if messages %}<ul class="mensajes">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block contenido %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
