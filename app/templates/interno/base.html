<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Cofrial{% endblock %} · Cofrial interno</title>
  <style>
    :root { --fondo:#f3f6f8; --panel:#fff; --tinta:#14232e; --suave:#5b6b77; --linea:#d5dee4; --acento:#1c6e8c; --ok:#2a8c5a; --alerta:#c8323c; --aviso:#b8860b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--fondo); color:var(--tinta); font-size:15px; }
    header { background:var(--tinta); color:#fff; padding:10px 20px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    header b { font-size:16px; } header a { color:#cfe3ec; text-decoration:none; } header a:hover { color:#fff; }
    header .yo { margin-left:auto; color:#9fb3c0; font-size:13px; }
    main { padding:20px; max-width:1400px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--suave); margin:0 0 18px; }
    .panel { background:var(--panel); border:1px solid var(--linea); border-radius:10px; padding:14px; }
    table { border-collapse:collapse; width:100%; font-size:14px; }
    th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--linea); vertical-align:top; }
    th { background:#e8eef2; font-weight:600; }
    .pill { display:inline-block; padding:1px 8px; border-radius:12px; font-size:12px; border:1px solid var(--linea); background:#eef3f6; }
    .pill.alerta { background:#fde8ea; border-color:#f3b4ba; color:#8f1d25; } .pill.ok { background:#e5f5ec; border-color:#b2dcc3; color:#1d6640; }
    .pill.aviso { background:#fdf3dc; border-color:#ecd28f; color:#7a5a06; }
    button,.btn { background:var(--acento); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; text-decoration:none; }
    input,select,textarea { font:inherit; padding:6px 8px; border:1px solid var(--linea); border-radius:6px; }
    .mensajes { list-style:none; padding:0; margin:0 0 14px; } .mensajes li { padding:8px 12px; border-radius:6px; background:#e5f5ec; margin-bottom:6px; }
    .mensajes li.error { background:#fde8ea; }
  </style>
</head>
<body>
<header>
  <b>Cofrial</b>
  <a href="/crm/">CRM</a>
  <a href="/ops/">Torre de control</a>
  <a href="/dashboard/">Pedidos y catálogo</a>
  <a href="/admin/">Administración</a>
  {% if user.is_authenticated %}<span class="yo">{{ user.email|default:user.username }} · <a href="/accounts/logout/">Salir</a></span>{% endif %}
</header>
<main>
  {% if messages %}<ul class="mensajes">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
